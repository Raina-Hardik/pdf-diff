[project]
name = "pdf-diff"
version = "0.0.1"
description = "Convert PDFs into stable Markdown files for downstream diff workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pdfsmith[recommended]>=0.2.0",
    "pypdf>=6.9.1",
    "structlog>=25.5.0",
    "typer>=0.24.1",
]

[project.optional-dependencies]
delta = []
ocr = []

[project.scripts]
pdf-diff = "pdf_diff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
